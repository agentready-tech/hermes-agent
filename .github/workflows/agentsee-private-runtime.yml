name: Move exact Hermes releases to private registry
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: agentsee-private-runtime
  cancel-in-progress: false
jobs:
  copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install registry tool
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Copy immutable manifests and verify private pulls without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/kubernetes/promote_private_runtime.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: private-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agentsee-private-runtime/*.json
          if-no-files-found: ignore
          retention-days: 30
