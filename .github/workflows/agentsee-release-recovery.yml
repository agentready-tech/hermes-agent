name: Recover verified AgentSee release without rebuilding

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: agentsee-hermes-release
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'agentready-tech/hermes-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install registry tools and reserve image transfer space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Copy the exact image, verify privately and recover the release receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/kubernetes/recover_release.py
      - name: Save exact private image and recovered release receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermes-release-agentsee-v2026.11.6.1-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/agentsee-hermes-release/release-proof.json
            ${{ runner.temp }}/agentsee-hermes-release/source-proof.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Save recovery diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-recovery-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/agentsee-hermes-release/status.json
            ${{ runner.temp }}/agentsee-hermes-release/failure.private.log
            ${{ runner.temp }}/agentsee-hermes-release/package-metadata.json
            ${{ runner.temp }}/agentsee-hermes-release/registry-copy.log
            ${{ runner.temp }}/agentsee-hermes-release/registry-pull.log
          retention-days: 3
          if-no-files-found: ignore
